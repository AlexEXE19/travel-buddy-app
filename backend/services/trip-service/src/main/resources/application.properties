# Application Identity
spring.application.name=trip-service

  # Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

  # JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

  # RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

  # Server Port
server.port=8083

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

  # Logging
# Full inbound HTTP request/response bodies (HttpLoggingFilter)
logging.level.com.travelbuddy.http=INFO
# Application / business logs
logging.level.com.travelbuddy.tripservice=DEBUG


# Observability — Prometheus metrics + distributed tracing -> Tempo
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://tempo:9411/api/v2/spans

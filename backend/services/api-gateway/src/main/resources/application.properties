# Server Configuration
server.port=8080

# Application Identity
spring.application.name=api-gateway

# ==========================================
# Spring Cloud Gateway Routes
# ==========================================

# 1. Auth Service Route
spring.cloud.gateway.server.webflux.routes[0].id=auth-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

# 2. Profile Service Route
spring.cloud.gateway.server.webflux.routes[1].id=profile-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=${PROFILE_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/profile/**

# ==========================================
# Global CORS Configuration
# ==========================================
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET}

# ==========================================
# Actuator / Distributed Tracing (Zipkin)
# ==========================================
management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.tracing.export.zipkin.endpoint=http://zipkin:9411/api/v2/spans

# ==========================================
# Logging
# ==========================================
# logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.com.travelbuddy=DEBUG
logging.level.root=INFO
logging.level.com.travelbuddy=DEBUG
logging.level.io.micrometer.tracing=DEBUG
logging.level.io.opentelemetry=DEBUG

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Server Configuration
server.port=8080

# Application Identity
spring.application.name=api-gateway

# ==========================================
# Spring Cloud Gateway Routes
# ==========================================

# 1. Auth Service Route
spring.cloud.gateway.server.webflux.routes[0].id=auth-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

# 2. Profile Service Route
spring.cloud.gateway.server.webflux.routes[1].id=profile-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=${PROFILE_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/profile/**

# ==========================================
# Global CORS Configuration
# ==========================================
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET}

# ==========================================
# Actuator / Distributed Tracing (Zipkin)
# ==========================================
management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.tracing.export.zipkin.endpoint=http://tempo:9411/api/v2/spans
management.metrics.tags.application=${spring.application.name}

# ==========================================
# Logging
# ==========================================
# logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.root=INFO
logging.level.com.travelbuddy.http=INFO
logging.level.com.travelbuddy.apigateway=DEBUG
# The OpenTelemetry SDK logs a benign DEBUG line on every span; keep it quiet.
logging.level.io.opentelemetry=WARN

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# 2. Trip Service Route
spring.cloud.gateway.server.webflux.routes[2].id=trip-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=${TRIP_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/trips/**

# 3. Matching Service Route
spring.cloud.gateway.server.webflux.routes[3].id=matching-service-route
spring.cloud.gateway.server.webflux.routes[3].uri=${MATCHING_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/matching/**

# 4. Chat Service Route
spring.cloud.gateway.server.webflux.routes[4].id=chat-service-route
spring.cloud.gateway.server.webflux.routes[4].uri=${CHAT_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/chat/**

# 5. Reports (auth-service) — users file reports; requires a valid JWT
spring.cloud.gateway.server.webflux.routes[5].id=reports-route
spring.cloud.gateway.server.webflux.routes[5].uri=${AUTH_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/reports/**

# 6. Admin moderation (auth-service) — gateway restricts /admin/ to ROLE ADMIN
spring.cloud.gateway.server.webflux.routes[6].id=admin-route
spring.cloud.gateway.server.webflux.routes[6].uri=${AUTH_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/admin/**

# OpenAPI documentation
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth

springdoc.swagger-ui.urls[1].name=Profile Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/profile

springdoc.swagger-ui.urls[2].name=Trip Service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/trip

springdoc.swagger-ui.urls[3].name=Matching Service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/matching

springdoc.swagger-ui.urls[4].name=Chat Service
springdoc.swagger-ui.urls[4].url=/v3/api-docs/chat

springdoc.swagger-ui.urls[5].name=Embedding Service
springdoc.swagger-ui.urls[5].url=/v3/api-docs/embedding

# OpenAPI documentation routes
spring.cloud.gateway.server.webflux.routes[7].id=auth-openapi-route
spring.cloud.gateway.server.webflux.routes[7].uri=${AUTH_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/v3/api-docs/auth
spring.cloud.gateway.server.webflux.routes[7].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[8].id=profile-openapi-route
spring.cloud.gateway.server.webflux.routes[8].uri=${PROFILE_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/v3/api-docs/profile
spring.cloud.gateway.server.webflux.routes[8].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[9].id=trip-openapi-route
spring.cloud.gateway.server.webflux.routes[9].uri=${TRIP_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/v3/api-docs/trip
spring.cloud.gateway.server.webflux.routes[9].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[10].id=matching-openapi-route
spring.cloud.gateway.server.webflux.routes[10].uri=${MATCHING_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/v3/api-docs/matching
spring.cloud.gateway.server.webflux.routes[10].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[11].id=chat-openapi-route
spring.cloud.gateway.server.webflux.routes[11].uri=${CHAT_SERVICE_URI}
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/v3/api-docs/chat
spring.cloud.gateway.server.webflux.routes[11].filters[0]=SetPath=/v3/api-docs

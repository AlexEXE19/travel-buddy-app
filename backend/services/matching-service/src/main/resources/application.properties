# Application Identity
spring.application.name=matching-service

  # Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

  # JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

  # RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true


# Enable the Apache HttpClient 5 backend
feign.httpclient.hc5.enabled=true

# Increase the maximum total open connections allowed globally
feign.httpclient.hc5.max-connections=200

# Increase the maximum connections allowed to a single target route 
feign.httpclient.hc5.max-connections-per-route=50

  # Server Port
server.port=8084

spring.sql.init.mode=never

  # Logging
# Full inbound HTTP request/response bodies (HttpLoggingFilter)
logging.level.com.travelbuddy.http=INFO
# Application / business logs
logging.level.com.travelbuddy.matchingservice=DEBUG
# Full outbound Feign request/response for inter-service calls
logging.level.com.travelbuddy.matchingservice.client=DEBUG


# Observability — Prometheus metrics + distributed tracing -> Tempo
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://tempo:9411/api/v2/spans

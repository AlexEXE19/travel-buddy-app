name: CI Pipeline

on:
  push:
    branches: ["master", "dev"]
  pull_request:
    branches: ["master"]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build api-gateway
        run: |
          cd backend/services/api-gateway
          chmod +x gradlew
          ./gradlew build -x test

      - name: Build auth-service
        run: |
          cd backend/services/auth-service
          chmod +x gradlew
          ./gradlew build -x test

      - name: Build profile-service
        run: |
          cd backend/services/profile-service
          chmod +x gradlew
          ./gradlew build -x test

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

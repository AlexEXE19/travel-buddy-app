global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot services expose Micrometer metrics at /actuator/prometheus
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8081']
  - job_name: profile-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['profile-service:8082']
  - job_name: trip-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['trip-service:8083']
  - job_name: matching-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['matching-service:8084']
  - job_name: chat-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['chat-service:8086']

  # FastAPI embedding service (prometheus-fastapi-instrumentator) at /metrics
  - job_name: embedding-service
    metrics_path: /metrics
    static_configs:
      - targets: ['embedding-service:8085']

  # The observability components expose their own /metrics too
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

apiVersion: 1

datasources:
  # ---- Metrics ----
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # ---- Logs ----
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Make any 32-hex trace id in a log line clickable -> opens the trace in Tempo.
      derivedFields:
        - name: TraceID
          matcherRegex: "([a-f0-9]{32})"
          url: "${__value.raw}"
          datasourceUid: tempo

  # ---- Traces ----
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # From a span, jump to the matching service's logs in Loki.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        tags:
          - key: "service.name"
            value: "service"
      # Service graph is built from span metrics stored in Prometheus.
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
